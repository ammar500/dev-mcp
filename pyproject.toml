[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "dev-mcp"
version = "0.1.0"
description = "Shared local MCP service for development workflows"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Ammar" }]
dependencies = [
    "mcp>=2.1.1,<3",
    "PyYAML>=6.0.2,<7",
]

[project.scripts]
dev-mcp = "dev_mcp.server:main"

[dependency-groups]
dev = [
    "mcp[cli]>=2.1.1,<3",
    "mypy>=1.14,<2",
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
    "pytest-cov>=6,<8",
    "ruff>=0.9,<1",
    "types-PyYAML>=6,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dev_mcp"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: exercises the subprocess transport",
]

[tool.coverage.run]
branch = true
source = ["dev_mcp"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["dev_mcp"]
